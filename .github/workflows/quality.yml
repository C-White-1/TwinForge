name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests examples

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest
