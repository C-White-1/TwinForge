[project]
name = "twinforge"
version = "0.1.0"
description = "ControlLogix and CIP discovery toolkit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pycomm3>=1.2.16",
    "pydantic>=2.13.4",
]

[project.scripts]
twinforge = "twinforge.cli:main"

[project.optional-dependencies]
validation = [
    "lxml>=6.1.1",
]
snmp = [
    "pysnmp>=7.1.27,<7.1.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"twinforge.schemas" = ["*.json"]

[tool.pyright]
include = [
    "src/twinforge",
    "tests",
    "examples",
]
exclude = [
    # Preserve Pyright's default excludes when supplying project exclusions.
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    # Legacy live-discovery example for an API that is not implemented yet.
    "examples/build_twin.py",
    "reference",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "--basetemp=.test-artifacts"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.15.20",
]
snmp-sim = [
    "cryptography>=43,<44",
    "pysmi-lextudio>=1.4.3",
    "snmpsim>=1.2.2",
]
