[project]
name = "twinforge"
version = "0.1.0"
description = "ControlLogix and CIP discovery toolkit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pycomm3>=1.2.16",
]

[project.optional-dependencies]
validation = [
    "lxml>=6.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.15.20",
]
