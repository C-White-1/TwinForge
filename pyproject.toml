[project]
name = "twinforge"
version = "0.1.0"
description = "ControlLogix and CIP discovery toolkit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pycomm3>=1.2.16",
]

[project.optional-dependencies]
validation = [
    "lxml>=6.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = [
    "src/twinforge",
    "tests",
    "examples",
]
exclude = [
    # Legacy live-discovery example for an API that is not implemented yet.
    "examples/build_twin.py",
    "reference",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.1",
    "ruff>=0.15.20",
]
